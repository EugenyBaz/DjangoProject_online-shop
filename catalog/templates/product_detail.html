
{% extends 'home.html' %}
{% load my_tags%}
{% block content %}

<head>
    <style>
        .card-body {
            position: relative; /* Устанавливаем родительский элемент как относительный */
        }

        .card-body .btn {
            position: absolute; /* Фиксируем кнопку относительно родительского элемента */
            bottom: 10px; /* Отступ от нижнего края */
            left: 50%; /* Центрирование по горизонтали */
            transform: translateX(-50%); /* Корректировка для точного центрирования */
        }
    </style>
</head>

<div class="container">
    <div class="row text-center">
        <div class="col">
            <div class="card" style = "width: 18rem; height: 30rem;">
                <img src="{{product.photo | media_filter}}" class="card-img-center" style="height: 250px; object-fit: cover;" alt="{{ product.name }}">
                <div class="card-body">
                    <p class="card-text h6">{{ product.name }}</p>
                    <p class="card-text ">{{ product.description | truncatechars:100 }}</p>
                    <p class="card-text h6" style ="margin-bottom: -1rem;"> Цена: {{ product.price }} руб.</p>

                </div>
                <div class="ms-3 mb-2">
                    <a class="p-2 btn btn-outline-primary mt-0" href="#">Купить</a>
                    <a class="p-2 btn btn-outline-primary" href="/">Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
